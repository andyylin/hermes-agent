name: Candidate deploy safety

# Exceptional-lane exact-SHA checks. ANDY_RUNTIME_PATCHES.md leaves broad
# GitHub CI optional on the routine lane and asks the exceptional lane for
# hosted CI on one commit. This workflow is not called from ci.yaml, does not
# run the full suite, and does not push to main, so rpi5-deploy.yml is not
# involved. It never edits needs_manual or the manual-lane classification.
#
# pull_request checks the PR head. workflow_dispatch checks the sha input, so
# the v0.23.0 squash ab2bbde6 can be re-run. That squash is also checked on
# the evidence branch below; other PRs skip it because its duplicate helper
# is a known historical failure.

on:
  pull_request:
    paths:
      - ".github/workflows/candidate-deploy-safety.yml"
      - ".github/workflows/README.md"
      - "ANDY_RUNTIME_PATCHES.md"
      - "PATCH-SCORE.md"
      - "pyproject.toml"
      - "uv.lock"
      - "pm/lock.json"
      - "docs/ops/**"
      - "cron/**"
      - "hermes_cli/config.py"
      - "hermes_cli/config_*.py"
      - "hermes_cli/config_migrations*.py"
      - "plugins/platforms/**"
      - "tools/send_message_tool.py"
      - "tools/skill_manager_tool.py"
      - "agent/secret_sources/**"
      - "gateway/session_message_events.py"
      - "scripts/maintenance/**"
      - "tests/scripts/test_candidate_deploy_safety.py"
      - "tests/scripts/test_rpi5_deploy.py"
      - "tests/scripts/test_rpi5_preflight.py"
  workflow_dispatch:
    inputs:
      sha:
        description: Exact commit to check. Empty checks this workflow's SHA.
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: candidate-deploy-safety-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  safety:
    name: deploy safety (${{ matrix.label }})
    # matrix is not a job-level context. A job `if` that names it makes
    # GitHub reject the file at push (0 jobs, "Unrecognized named-value").
    # The historical squash is skipped per step instead.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: head
            sha: ""
          - label: ab2bbde6
            sha: ab2bbde6afc428a85e74a8b39a76754fcac3745b
    steps:
      - name: Checkout
        if: matrix.label == 'head' || (github.event_name == 'pull_request' && github.head_ref == 'cursor/v0230-deploy-safety-7fa2')
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      - name: Setup Python
        id: python
        if: matrix.label == 'head' || (github.event_name == 'pull_request' && github.head_ref == 'cursor/v0230-deploy-safety-7fa2')
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock
            pm/lock.json

      - name: Restore uv cache
        if: matrix.label == 'head' || (github.event_name == 'pull_request' && github.head_ref == 'cursor/v0230-deploy-safety-7fa2')
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/candidate-deploy-safety/uv-cache
          key: deploy-safety-uv-${{ hashFiles('pyproject.toml', 'uv.lock', 'pm/lock.json') }}

      - name: Run exact-SHA deploy-safety checks
        if: matrix.label == 'head' || (github.event_name == 'pull_request' && github.head_ref == 'cursor/v0230-deploy-safety-7fa2')
        env:
          MATRIX_SHA: ${{ matrix.sha }}
          INPUT_SHA: ${{ inputs.sha }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          CHECK_PYTHON: ${{ steps.python.outputs.python-path }}
          SAFETY_SCRATCH: ${{ runner.temp }}/candidate-deploy-safety
        run: |
          set -euo pipefail
          if [ -n "$MATRIX_SHA" ]; then
            target="$MATRIX_SHA"
          elif [ -n "$INPUT_SHA" ]; then
            target="$INPUT_SHA"
          elif [ -n "$PR_SHA" ]; then
            target="$PR_SHA"
          else
            target="$GITHUB_SHA"
          fi
          case "$target" in
            *[!0-9a-fA-F]*) echo "refusing non-hex sha" >&2; exit 2 ;;
          esac
          git cat-file -e "${target}^{commit}" 2>/dev/null || git fetch --filter=blob:none --no-tags origin "$target"
          python "$GITHUB_WORKSPACE/docs/ops/candidate_deploy_safety.py" \
            --repo "$GITHUB_WORKSPACE" \
            --sha "$target" \
            --scratch "$SAFETY_SCRATCH" \
            --python "$CHECK_PYTHON" \
            --live-config-version 51

      - name: Save uv cache
        if: matrix.label == 'head' && success()
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/candidate-deploy-safety/uv-cache
          key: deploy-safety-uv-${{ hashFiles('pyproject.toml', 'uv.lock', 'pm/lock.json') }}

      - name: Focused regression tests
        if: (success() || failure()) && (matrix.label == 'head' || (github.event_name == 'pull_request' && github.head_ref == 'cursor/v0230-deploy-safety-7fa2'))
        env:
          HERMES_PYTHON: ${{ runner.temp }}/candidate-deploy-safety/venv/bin/python
        run: |
          set -euo pipefail
          if [ ! -x "$HERMES_PYTHON" ]; then
            echo "scratch interpreter missing; safety install did not finish" >&2
            exit 1
          fi
          scripts/run_tests.sh tests/scripts/test_candidate_deploy_safety.py

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Dependency graph enabled
        id: graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code="$(curl -sS -o "$RUNNER_TEMP/dependency-graph.json" -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/dependency-graph/sbom")"
          if [ "$code" = "200" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" = "404" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Dependency graph is not enabled for ${GITHUB_REPOSITORY}." >> "$GITHUB_STEP_SUMMARY"
            echo "actions/dependency-review-action cannot run until it is. The action stays in this job." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "dependency graph probe returned HTTP $code" >&2
            cat "$RUNNER_TEMP/dependency-graph.json" >&2
            exit 1
          fi

      - name: Review pull request dependencies
        if: steps.graph.outputs.available == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  candidate-dependency-review:
    name: dependency review (freeze to target)
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'cursor/v0230-deploy-safety-7fa2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none

      - name: Resolve the ledger freeze and the target SHA
        id: range
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_SHA" ]; then
            target="$INPUT_SHA"
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            target="ab2bbde6afc428a85e74a8b39a76754fcac3745b"
          else
            target="$GITHUB_SHA"
          fi
          case "$target" in
            *[!0-9a-fA-F]*) echo "refusing non-hex sha" >&2; exit 2 ;;
          esac
          git cat-file -e "${target}^{commit}" 2>/dev/null || git fetch --filter=blob:none --depth=1 origin "$target"
          full="$(git rev-parse "${target}^{commit}")"
          git show "${full}:ANDY_RUNTIME_PATCHES.md" > "$RUNNER_TEMP/ledger.md"
          freeze="$(python3 -c 'import sys; sys.path.insert(0, "docs/ops"); import candidate_deploy_safety as s; print(s.parse_ledger_freeze(open(sys.argv[1], encoding="utf-8").read()).sha)' "$RUNNER_TEMP/ledger.md")"
          echo "base=$freeze" >> "$GITHUB_OUTPUT"
          echo "head=$full" >> "$GITHUB_OUTPUT"
          {
            echo "## Dependency review range"
            echo ""
            echo "Base is the ledger freeze \`$freeze\`. Head is \`$full\`."
            echo "The manual deploy gate is unchanged."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Review the freeze-to-target dependency delta
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: ${{ steps.range.outputs.base }}
          head-ref: ${{ steps.range.outputs.head }}
